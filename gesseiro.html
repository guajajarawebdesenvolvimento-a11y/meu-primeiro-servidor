<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">Gesseiro - SeuGesseiro</title>
    <meta name="description" id="pageDescription" content="Perfil de gesseiro profissional">
    <link rel="canonical" id="pageCanonical" href="https://seugesseiro.com.br/gesseiro.html">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script async src="https://maps.googleapis.com/maps/api/js?key=AIzaSyD_pMBr9EehGOeOyuVdH_peUfWVfDkCSKw"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --primary: #1a1a2e;
            --accent: #e94560;
            --green: #00b09b;
            --gold: #f7c948;
            --light: #f8f9ff;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--light);
            color: var(--primary);
            line-height: 1.6;
        }

        .header {
            background: var(--primary);
            color: white;
            padding: 16px 20px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 20px rgba(0,0,0,0.1);
        }

        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-family: 'Sora', sans-serif;
            font-size: 20px;
            font-weight: 800;
            text-decoration: none;
            color: white;
        }

        /* HERO */
        .hero {
            background: linear-gradient(135deg, var(--primary) 0%, #2d2d44 100%);
            padding: 60px 20px;
            color: white;
        }

        .hero-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            gap: 40px;
            align-items: center;
            flex-wrap: wrap;
        }

        .hero-foto {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent), #764ba2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 64px;
            color: white;
            font-weight: 800;
            overflow: hidden;
            border: 6px solid rgba(255,255,255,0.2);
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            flex-shrink: 0;
        }

        .hero-foto img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .hero-info h1 {
            font-family: 'Sora', sans-serif;
            font-size: 42px;
            font-weight: 800;
            margin-bottom: 12px;
        }

        .hero-info .cidade {
            font-size: 18px;
            opacity: 0.9;
            margin-bottom: 16px;
        }

        .hero-info .descricao {
            font-size: 16px;
            opacity: 0.85;
            margin-bottom: 24px;
        }

        .badge-premium {
            background: linear-gradient(135deg, var(--gold), #f59e0b);
            color: #92400e;
            padding: 8px 20px;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 700;
            margin-left: 12px;
            box-shadow: 0 4px 12px rgba(247,201,72,0.4);
        }

        .avaliacoes-hero {
            background: rgba(255,255,255,0.1);
            padding: 12px 20px;
            border-radius: 50px;
            display: inline-flex;
            align-items: center;
            gap: 12px;
        }

        .avaliacoes-hero .estrelas { color: #ffc107; }

        /* BOTÃO WHATSAPP FLUTUANTE */
        .btn-whatsapp-float {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: linear-gradient(135deg, #25D366, #128C7E);
            color: white;
            padding: 18px 32px;
            border: none;
            border-radius: 50px;
            font-size: 18px;
            font-weight: 700;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 8px 24px rgba(37,211,102,0.4);
            z-index: 999;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 8px 24px rgba(37,211,102,0.4); }
            50% { box-shadow: 0 8px 32px rgba(37,211,102,0.6); }
        }

        .btn-instagram-float {
            position: fixed;
            bottom: 100px;
            right: 30px;
            background: linear-gradient(135deg, #E1306C, #C13584);
            color: white;
            padding: 18px 32px;
            border: none;
            border-radius: 50px;
            font-size: 18px;
            font-weight: 700;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 8px 24px rgba(225,48,108,0.4);
            z-index: 999;
            animation: pulse-insta 2s infinite;
        }

        @keyframes pulse-insta {
            0%, 100% { box-shadow: 0 8px 24px rgba(225,48,108,0.4); }
            50% { box-shadow: 0 8px 32px rgba(225,48,108,0.6); }
        }

        .container { max-width: 1200px; margin: 0 auto; padding: 40px 20px; }

        .section {
            background: white;
            border-radius: 24px;
            padding: 40px;
            margin-bottom: 30px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
        }

        .section h2 {
            font-family: 'Sora', sans-serif;
            font-size: 28px;
            margin-bottom: 28px;
        }

        .servicos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .servico-card {
            background: linear-gradient(135deg, #f8f9fa, #e9ecef);
            padding: 24px;
            border-radius: 16px;
            border-left: 5px solid var(--accent);
        }

        .servico-card h3 { font-size: 20px; margin-bottom: 16px; }

        .preco-tag {
            display: inline-block;
            background: linear-gradient(135deg, var(--green), #059669);
            color: white;
            padding: 8px 16px;
            border-radius: 8px;
            margin-right: 10px;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .fotos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .foto-card {
            border-radius: 16px;
            overflow: hidden;
            cursor: pointer;
            box-shadow: 0 4px 16px rgba(0,0,0,0.1);
            transition: transform 0.3s;
        }

        .foto-card:hover { transform: translateY(-6px); }

        .foto-card img {
            width: 100%;
            height: 240px;
            object-fit: cover;
        }

        .mapa {
            width: 100%;
            height: 450px;
            border-radius: 16px;
            overflow: hidden;
        }

        .loading { text-align: center; padding: 80px 20px; color: #999; }
        .erro { text-align: center; padding: 80px 20px; color: var(--accent); }
    </style>
</head>
<body>

<div class="header">
    <div class="header-content">
        <a href="/" class="logo">🏗️ SeuGesseiro</a>
        <a href="/" style="color:white; text-decoration:none;">← Voltar</a>
    </div>
</div>

<div id="mainContent">
    <div class="loading">🔍 Carregando perfil...</div>
</div>

<script>
const urlParams = new URLSearchParams(window.location.search);
const gesseiroId = urlParams.get('id');

if (!gesseiroId) {
    document.getElementById('mainContent').innerHTML = '<div class="erro">❌ ID não especificado</div>';
} else {
    carregarPerfil();
}

async function carregarPerfil() {
    try {
        const response = await fetch(`/api/gesseiros/${gesseiroId}`);
        if (!response.ok) {
            document.getElementById('mainContent').innerHTML = '<div class="erro">❌ Gesseiro não encontrado</div>';
            return;
        }

        const gesseiro = await response.json();

        document.getElementById('pageTitle').textContent = `${gesseiro.nome} - ${gesseiro.cidade}`;

        const [fotosRes, servicosRes, avaliacoesRes, planoRes] = await Promise.all([
            fetch(`/api/gesseiros/${gesseiroId}/fotos`),
            fetch(`/api/gesseiros/${gesseiroId}/servicos`),
            fetch(`/api/gesseiros/${gesseiroId}/avaliacoes`),
            fetch(`/api/gesseiros/${gesseiroId}/plano`)
        ]);

        const fotos = await fotosRes.json();
        const servicos = await servicosRes.json();
        const avaliacoes = await avaliacoesRes.json();
        const plano = await planoRes.json();

        renderizar(gesseiro, fotos, servicos, avaliacoes, plano);
    } catch (err) {
        document.getElementById('mainContent').innerHTML = '<div class="erro">❌ Erro ao carregar</div>';
    }
}

function renderizar(g, fotos, servicos, avaliacoes, plano) {
    const inicial = g.nome.charAt(0).toUpperCase();
    const whatsapp = g.telefone.replace(/\D/g, '');
    const msg = encodeURIComponent(`Olá ${g.nome}! Você é o meu gesseiro! Vi seu perfil e quero um orçamento.`);

    const badgePremium = plano.destaque ? '<span class="badge-premium">👑 PREMIUM</span>' : '';
    const fotoHTML = g.foto_perfil ? `<img src="${g.foto_perfil}">` : inicial;

    const avalHTML = g.total_avaliacoes > 0
        ? `<div class="avaliacoes-hero">
            <span class="estrelas">${'⭐'.repeat(Math.round(g.media_avaliacoes))}</span>
            <strong>${g.media_avaliacoes.toFixed(1)}</strong>
            <span>(${g.total_avaliacoes})</span>
           </div>`
        : '';

    let html = `
        <div class="hero">
            <div class="hero-content">
                <div class="hero-foto">${fotoHTML}</div>
                <div class="hero-info">
                    <h1>${g.nome}${badgePremium}</h1>
                    <p class="cidade">📍 ${g.cidade}</p>
                    <p class="descricao">${g.descricao || ''}</p>
                    ${avalHTML}
                </div>
            </div>
        </div>
        <div class="container">
    `;

    if (servicos.length > 0) {
        html += `<div class="section"><h2>💰 Serviços</h2><div class="servicos-grid">`;
        servicos.forEach(s => {
            html += `<div class="servico-card">
                <h3>${s.nome_servico}</h3>
                <span class="preco-tag">Com: R$ ${s.preco_com_material.toFixed(2)}/${s.unidade}</span>
                <span class="preco-tag">Sem: R$ ${s.preco_sem_material.toFixed(2)}/${s.unidade}</span>
                <p style="color:#666;margin-top:12px;">📍 Até ${s.distancia_maxima}km</p>
            </div>`;
        });
        html += `</div></div>`;
    }

    if (fotos.length > 0) {
        html += `<div class="section"><h2>📷 Portfólio (${fotos.length})</h2><div class="fotos-grid">`;
        fotos.forEach(f => {
            html += `<div class="foto-card" onclick="window.open('${f.url_foto}','_blank')">
                <img src="${f.url_foto}">
            </div>`;
        });
        html += `</div></div>`;
    }

    if (g.latitude && g.longitude) {
        html += `<div class="section"><h2>📍 Localização</h2>
            <p style="margin-bottom:20px;">${g.endereco || g.cidade}</p>
            <div id="mapa" class="mapa"></div>
        </div>`;
    }

    html += `</div>`;

    html += `<a href="https://wa.me/55${whatsapp}?text=${msg}" 
                class="btn-whatsapp-float" target="_blank" 
                onclick="registrarClique('whatsapp')">💬 WhatsApp</a>`;

    // Adicionar botão Instagram se tiver
    if (g.instagram) {
        const instaUsername = g.instagram.replace('@', '');
        html += `<a href="https://instagram.com/${instaUsername}" 
                    class="btn-instagram-float" target="_blank" 
                    onclick="registrarClique('instagram')">📷 Instagram</a>`;
    }

    document.getElementById('mainContent').innerHTML = html;

    if (g.latitude && g.longitude && typeof google !== 'undefined') {
        setTimeout(() => {
            const map = new google.maps.Map(document.getElementById('mapa'), {
                center: { lat: g.latitude, lng: g.longitude },
                zoom: 15
            });
            new google.maps.Marker({ position: { lat: g.latitude, lng: g.longitude }, map });
        }, 300);
    }
}

async function registrarClique(tipo) {
    try {
        await fetch(`/api/cliques/${gesseiroId}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ tipo })
        });
    } catch {}
}
</script>
</body>
</html>
