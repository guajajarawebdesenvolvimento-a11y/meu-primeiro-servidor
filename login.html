<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SeuGesseiro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #2d2d44 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            background: white;
            border-radius: 24px;
            padding: 48px 40px;
            max-width: 440px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        .logo {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo h1 {
            font-family: 'Sora', sans-serif;
            font-size: 32px;
            color: #1a1a2e;
            margin-bottom: 8px;
        }

        .logo p {
            color: #666;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 24px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #1a1a2e;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 16px;
            font-family: inherit;
            transition: border 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #e94560;
        }

        .btn-login {
            width: 100%;
            background: linear-gradient(135deg, #e94560, #c73652);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.3s;
            font-family: 'Sora', sans-serif;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(233,69,96,0.4);
        }

        .links {
            text-align: center;
            margin-top: 24px;
        }

        .links a {
            color: #e94560;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
        }

        .links a:hover {
            text-decoration: underline;
        }

        .divider {
            text-align: center;
            margin: 24px 0;
            color: #999;
            font-size: 14px;
        }

        .alert {
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }

        .alert.error {
            background: #fee;
            color: #c00;
            border: 1px solid #fcc;
        }

        .alert.success {
            background: #efe;
            color: #0a0;
            border: 1px solid #cfc;
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 32px 24px;
            }
        }
    </style>
</head>
<body>

<div class="login-container">
    <div class="logo">
        <h1>🏗️ SeuGesseiro</h1>
        <p>Acesse seu painel</p>
    </div>

    <div id="alerta" class="alert"></div>

    <form id="formLogin">
        <div class="form-group">
            <label>Email</label>
            <input type="email" id="email" required placeholder="seu@email.com" autocomplete="email">
        </div>

        <div class="form-group">
            <label>Senha</label>
            <input type="password" id="senha" required placeholder="••••••••" autocomplete="current-password">
        </div>

        <button type="submit" class="btn-login">Entrar</button>
    </form>

    <div class="divider">ou</div>

    <div class="links">
        <a href="cadastro-gesseiro.html">Ainda não tem conta? Cadastre-se grátis</a>
        <br><br>
        <a href="/">← Voltar para página inicial</a>
    </div>
</div>

<script>
document.getElementById('formLogin').addEventListener('submit', async (e) => {
    e.preventDefault();

    const email = document.getElementById('email').value;
    const senha = document.getElementById('senha').value;

    try {
        const response = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, senha })
        });

        const data = await response.json();

        if (response.ok) {
            localStorage.setItem('token', data.token);
            localStorage.setItem('gesseiroId', data.gesseiroId);
            localStorage.setItem('nomeGesseiro', data.nome);

            const alerta = document.getElementById('alerta');
            alerta.className = 'alert success';
            alerta.textContent = '✅ Login realizado! Redirecionando...';
            alerta.style.display = 'block';

            setTimeout(() => {
                window.location.href = 'painel-gesseiro.html';
            }, 1000);
        } else {
            const alerta = document.getElementById('alerta');
            alerta.className = 'alert error';
            alerta.textContent = '❌ ' + (data.erro || 'Email ou senha incorretos');
            alerta.style.display = 'block';
        }
    } catch (error) {
        const alerta = document.getElementById('alerta');
        alerta.className = 'alert error';
        alerta.textContent = '❌ Erro ao conectar. Tente novamente.';
        alerta.style.display = 'block';
    }
});
</script>

</body>
</html>
