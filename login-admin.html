<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔐 Login Administrador - SeuGesseiro</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 50%, #7e22ce 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        /* Efeito de partículas */
        body::before {
            content: '';
            position: absolute;
            width: 200%;
            height: 200%;
            background-image: 
                radial-gradient(circle, rgba(255,255,255,0.1) 1px, transparent 1px),
                radial-gradient(circle, rgba(255,255,255,0.05) 1px, transparent 1px);
            background-size: 50px 50px;
            background-position: 0 0, 25px 25px;
            animation: drift 20s linear infinite;
        }

        @keyframes drift {
            0% { transform: translate(0, 0); }
            100% { transform: translate(50px, 50px); }
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 30px 80px rgba(0,0,0,0.4);
            width: 100%;
            max-width: 450px;
            padding: 50px 40px;
            animation: slideUp 0.6s ease;
            position: relative;
            z-index: 1;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 40px;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
        }

        .logo h1 {
            font-size: 28px;
            background: linear-gradient(135deg, #1e3c72 0%, #7e22ce 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
        }

        .logo p {
            color: #666;
            font-size: 14px;
            font-weight: 600;
        }

        .admin-badge {
            display: inline-block;
            background: linear-gradient(135deg, #dc2626 0%, #991b1b 100%);
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            margin-top: 10px;
            box-shadow: 0 5px 15px rgba(220, 38, 38, 0.3);
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 15px;
            transition: all 0.3s;
            font-family: inherit;
        }

        input:focus {
            outline: none;
            border-color: #7e22ce;
            box-shadow: 0 0 0 4px rgba(126, 34, 206, 0.1);
        }

        .btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #1e3c72 0%, #7e22ce 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(126, 34, 206, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .alert {
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
            animation: shake 0.5s;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .alert.success {
            background: #d1fae5;
            color: #065f46;
            border: 2px solid #10b981;
        }

        .alert.error {
            background: #fee2e2;
            color: #991b1b;
            border: 2px solid #ef4444;
        }

        .links {
            text-align: center;
            margin-top: 30px;
            padding-top: 25px;
            border-top: 2px solid #e0e0e0;
        }

        .links a {
            color: #7e22ce;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s;
        }

        .links a:hover {
            color: #1e3c72;
        }

        .security-notice {
            background: #fef3c7;
            border: 2px solid #f59e0b;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 25px;
            font-size: 13px;
            color: #92400e;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .security-notice::before {
            content: '⚠️';
            font-size: 24px;
        }

        @media (max-width: 480px) {
            .container {
                padding: 40px 25px;
            }

            .logo h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <div class="logo-icon">🔐</div>
            <h1>Acesso Restrito</h1>
            <p>Painel de Administração</p>
            <span class="admin-badge">ADMIN ONLY</span>
        </div>

        <div class="security-notice">
            <div>
                <strong>Área Restrita</strong><br>
                Apenas administradores autorizados podem acessar este painel.
            </div>
        </div>

        <div id="alerta" class="alert"></div>

        <form id="formLogin">
            <div class="form-group">
                <label for="email">👤 Usuário Administrador</label>
                <input 
                    type="text" 
                    id="email" 
                    required 
                    placeholder="GesseiroAdmin"
                    autocomplete="username"
                >
            </div>

            <div class="form-group">
                <label for="senha">🔑 Senha de Administrador</label>
                <input 
                    type="password" 
                    id="senha" 
                    required 
                    placeholder="••••••••"
                    autocomplete="current-password"
                >
            </div>

            <button type="submit" class="btn" id="btnLogin">
                Acessar Painel Admin
            </button>
        </form>

        <div class="links">
            <p style="margin-bottom: 10px; color: #666; font-size: 14px;">Não é administrador?</p>
            <a href="index.html">← Voltar para o site</a>
        </div>
    </div>

    <script>
        const formLogin = document.getElementById('formLogin');
        const alerta = document.getElementById('alerta');
        const btnLogin = document.getElementById('btnLogin');

        function mostrarAlerta(mensagem, tipo) {
            alerta.textContent = mensagem;
            alerta.className = `alert ${tipo}`;
            alerta.style.display = 'block';
            
            if (tipo === 'error') {
                alerta.style.animation = 'none';
                setTimeout(() => {
                    alerta.style.animation = 'shake 0.5s';
                }, 10);
            }
            
            setTimeout(() => {
                alerta.style.display = 'none';
            }, 5000);
        }

        formLogin.addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value.trim();
            const senha = document.getElementById('senha').value;

            // Validação básica
            if (!email || !senha) {
                mostrarAlerta('⚠️ Preencha todos os campos', 'error');
                return;
            }

            // Desabilitar botão durante requisição
            btnLogin.disabled = true;
            btnLogin.textContent = '🔄 Verificando...';

            try {
                const response = await fetch('/api/admin/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, senha })
                });

                const data = await response.json();

                if (response.ok) {
                    // Salvar token do admin
                    localStorage.setItem('adminToken', data.token);
                    localStorage.setItem('adminNome', data.nome);
                    localStorage.setItem('isAdmin', 'true');
                    
                    mostrarAlerta('✅ Acesso autorizado! Redirecionando...', 'success');
                    
                    setTimeout(() => {
                        window.location.href = 'painel-admin.html';
                    }, 1500);
                } else {
                    mostrarAlerta('❌ ' + (data.erro || 'Credenciais inválidas'), 'error');
                    btnLogin.disabled = false;
                    btnLogin.textContent = 'Acessar Painel Admin';
                }
            } catch (error) {
                console.error('Erro:', error);
                mostrarAlerta('❌ Erro ao conectar com o servidor', 'error');
                btnLogin.disabled = false;
                btnLogin.textContent = 'Acessar Painel Admin';
            }
        });

        // Verificar se já está logado como admin
        window.addEventListener('load', () => {
            const adminToken = localStorage.getItem('adminToken');
            if (adminToken) {
                window.location.href = 'painel-admin.html';
            }
        });
    </script>
</body>
</html>
